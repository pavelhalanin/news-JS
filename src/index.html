<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>

    <body>
        <input type="checkbox" name="burger" id="burger" class="burger__input" />
        <label class="burger__button" for="burger">☰</label>
        <header>
            <h1>News Portal</h1>
        </header>
        <main class="main__section">
            <nav class="nav">
                <div class="sources buttons scroll"></div>
            </nav>
            <div class="news__section">
                <div class="news scroll"></div>
                <footer class="footer__wrapper">
                    <div class="footer__buttons">
                        <a target="_blank" href="https://rs.school/courses/javascript">
                            <img src="./assets/footer/rss-logo.svg" alt="RS School" />
                            Full-Stack JavaScript 2026 Q3
                        </a>
                        <a target="_blank" href="https://github.com/pavelhalanin">
                            <img src="./assets/footer/github.svg" alt="GitHub" />
                            pavelhalanin
                        </a>
                    </div>
                    <p class="footer__copyright">Created on November 2026</p>
                    <p class="footer__copyright">© Copyright <a href="https://newsapi.org">NewsAPI</a></p>
                </footer>
            </div>
        </main>

        <template id="sourceItemTemp">
            <label class="source__item" for="burger">
                <span class="source__item-name"></span>
            </label>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
